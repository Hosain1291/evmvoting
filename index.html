<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자투표기 시뮬레이터 (v5 - 최종판)</title>
    <!-- Google Fonts import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS (스타일) 코드 -->
    <style>
        :root {
            --machine-bg: linear-gradient(145deg, #eef2f7, #ffffff);
            --panel-bg: #e2e8f0;
            --border-color: #b8c5d6;
            --text-dark: #1e293b;
            --text-light: #475569;
            --led-ready: #10b981;
            --led-vote: #ef4444;
            --button-primary: #3b82f6;
            --button-hover: #2563eb;
            --button-disabled: #9ca3af;
            --button-action: #059669;
            --button-stop: #dc2626;
            --button-manage: #5a67d8;
            --button-reset: #f59e0b;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 20px;
        }

        .simulator-wrapper {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 1. EVM 투표 패널 */
        .evm-machine {
            width: 540px;
            max-width: 95%;
            background: var(--machine-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1), 0 5px 10px rgba(0, 0, 0, 0.05);
            padding: 24px;
            box-sizing: border-box;
        }
        
        #poll-title-input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: 700;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
            color: var(--text-dark);
        }

        .status-panel {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--panel-bg);
            padding: 10px 16px; border-radius: 10px; margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .status-indicator { display: flex; align-items: center; gap: 10px; }
        #status-text { font-size: 16px; font-weight: 700; color: var(--text-dark); }
        .led { width: 22px; height: 22px; border-radius: 50%; }
        #ready-led { background-color: #6b7280; border: 2px solid #4b5563; }
        #ready-led.on { background-color: var(--led-ready); border-color: #059669; box-shadow: 0 0 12px var(--led-ready); }
        .panel-title { font-weight: 500; color: var(--text-light); }

        .candidate-management {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background-color: var(--panel-bg);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .manage-button {
            padding: 10px 15px; font-size: 14px; font-weight: 700; border: none;
            border-radius: 8px; color: white; cursor: pointer;
            background-color: var(--button-manage); transition: background-color 0.2s;
            text-align: center;
        }
        .manage-button:hover { background-color: #434190; }
        #reset-btn { background-color: var(--button-reset); grid-column: 1 / -1; }
        #reset-btn:hover { background-color: #d97706; }
        input[type="file"] { display: none; }

        .controls { display: flex; gap: 10px; margin: 20px 0; }
        .control-button {
            flex-grow: 1; padding: 12px; font-size: 16px; font-weight: 700;
            border: none; border-radius: 8px; color: white; cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        .control-button:disabled { cursor: not-allowed; opacity: 0.6; }
        #start-vote-btn { background-color: var(--button-action); }
        #end-vote-btn { background-color: var(--button-stop); }
        
        .ballot-unit {
            background-color: #f8fafc; border: 1px solid var(--border-color);
            border-radius: 10px; padding: 8px;
        }

        .candidate {
            display: grid; grid-template-columns: 1fr 60px 40px 100px;
            gap: 12px; align-items: center; padding: 10px 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        .candidate:last-child { border-bottom: none; }
        .candidate-name-input {
            width: 100%; border: 1px solid #ccc; border-radius: 6px; padding: 8px;
            font-size: 15px; color: var(--text-dark); box-sizing: border-box;
        }
        .candidate-photo { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; background-color: #fff; border: 1px solid var(--border-color); cursor: pointer; }
        
        .vote-led { width: 16px; height: 16px; background-color: #4b5563; border-radius: 50%; border: 1px solid #374151; justify-self: center; transition: background-color 0.1s; }
        .vote-led.on { background-color: var(--led-vote); box-shadow: 0 0 10px var(--led-vote); }
        
        .vote-button {
            width: 100%; height: 40px; background-color: var(--button-primary);
            border: none; border-radius: 20px; cursor: pointer;
            transition: background-color 0.2s, transform 0.1s; border-bottom: 3px solid #1d4ed8;
        }
        .vote-button:hover:not(:disabled) { background-color: var(--button-hover); }
        .vote-button:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 1px; }
        .vote-button:disabled { background-color: var(--button-disabled); cursor: not-allowed; border-bottom: 3px solid #64748b; }

        /* 2. VVPAT 실시간 종이 확인증 출력기 패널 */
        .vvpat-unit {
            width: 250px;
            background: linear-gradient(145deg, #cbd5e1, #e2e8f0);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-self: stretch;
        }
        .vvpat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #475569;
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 700;
        }
        .vvpat-led {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #6b7280;
            border: 1px solid #334155;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        .vvpat-display-window {
            height: 250px;
            background-color: #0f172a;
            border: 4px solid #334155;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.7);
        }
        .vvpat-display-window::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%);
            pointer-events: none;
            z-index: 5;
        }
        .vvpat-slip {
            width: 85%;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            padding: 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transform: translateY(-110%);
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
            font-size: 12px;
            color: #334155;
            text-align: center;
            border-bottom: 2px dashed #94a3b8;
            margin-top: 10px;
        }
        .vvpat-slip.printing {
            transform: translateY(10px);
        }
        .vvpat-slip.dropping {
            transform: translateY(270px);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.55, 0.055, 0.675, 0.19), opacity 0.4s;
        }
        .vvpat-slip-header {
            font-weight: bold;
            font-size: 11px;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
            width: 100%;
            padding-bottom: 6px;
            letter-spacing: 1px;
        }
        .vvpat-slip-photo {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            margin: 4px 0;
        }
        .vvpat-slip-name {
            font-size: 14px;
            font-weight: bold;
            color: #1e293b;
        }
        .vvpat-slip-footer {
            font-size: 9px;
            color: #94a3b8;
            border-top: 1px dashed #e2e8f0;
            width: 100%;
            padding-top: 6px;
        }
        .vvpat-drop-box {
            background-color: #334155;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #1e293b;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        
        /* 3. 오른쪽 집계/관리단 패널 */
        .right-panel-wrapper {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .results-panel {
            background: var(--machine-bg); border: 2px solid var(--border-color);
            border-radius: 16px; padding: 24px; box-sizing: border-box;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        .results-panel h2 { margin-top: 0; text-align: center; color: var(--text-dark); }
        #results-placeholder { text-align: center; color: var(--text-light); font-size: 16px; padding: 40px 0; }
        #results-list { list-style: none; padding: 0; margin: 0; }
        .result-item { display: flex; align-items: center; gap: 15px; padding: 12px 8px; border-bottom: 1px solid #e2e8f0; }
        .result-item:last-child { border-bottom: none; }
        .result-item .photo { width: 35px; height: 35px; border-radius: 6px; object-fit: cover; }
        .result-item .name { flex-grow: 1; font-weight: 500; }
        .result-item .count { font-weight: 700; background-color: var(--panel-bg); padding: 2px 8px; border-radius: 6px; }

        /* 토스트 알림창 */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #1e293b;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-weight: 500;
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s;
            opacity: 0;
            pointer-events: none;
        }
        .toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="simulator-wrapper">
        <!-- 1. EVM 투표 기기 -->
        <main class="evm-machine">
            <input type="text" id="poll-title-input" placeholder="투표 주제를 입력하세요...">

            <header class="status-panel">
                <div class="status-indicator">
                    <div id="ready-led" class="led"></div>
                    <span id="status-text">대기 중</span>
                </div>
                <span class="panel-title">전자 투표 용지</span>
            </header>
            
            <div class="controls">
                <button id="start-vote-btn" class="control-button">투표 시작</button>
                <button id="end-vote-btn" class="control-button">투표 종료</button>
            </div>

            <section id="ballot-unit" class="ballot-unit">
                <!-- 후보자 목록이 이곳에 생성됩니다. -->
            </section>
        </main>

        <!-- 2. VVPAT 출력 검증장치 (추가됨!) -->
        <section class="vvpat-unit">
            <div class="vvpat-header">
                <span>VVPAT 확인기</span>
                <div id="vvpat-led" class="vvpat-led"></div>
            </div>
            <div class="vvpat-display-window">
                <div id="vvpat-slip" class="vvpat-slip">
                    <div class="vvpat-slip-header">선거관리위원회 검증필</div>
                    <img id="vvpat-slip-photo" src="" alt="후보" class="vvpat-slip-photo" style="display:none;">
                    <div id="vvpat-slip-name" class="vvpat-slip-name">대기 중</div>
                    <div class="vvpat-slip-footer">내용 확인용 (DROP BOX 자동 보관)</div>
                </div>
            </div>
            <div class="vvpat-drop-box">
                <span>SECURE DROP BOX</span>
            </div>
        </section>

        <!-- 3. 오른쪽 결과 및 관리 패널 -->
        <div class="right-panel-wrapper">
            <aside class="results-panel">
                <h2>투표 집계 현황</h2>
                <div id="results-placeholder">투표 종료 시 결과가 표시됩니다.</div>
                <ul id="results-list" style="display: none;"></ul>
            </aside>

            <div class="candidate-management">
                <button id="add-candidate-btn" class="manage-button">후보자 추가</button>
                <label for="load-json-input" class="manage-button">목록 불러오기</label>
                <button id="save-json-btn" class="manage-button">후보자 목록 저장</button>
                <button id="reset-btn" class="manage-button">전체 초기화</button>
                <input type="file" id="load-json-input" accept=".json">
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // HTML 요소 바인딩
            const ballotUnit = document.getElementById('ballot-unit');
            const statusText = document.getElementById('status-text');
            const readyLed = document.getElementById('ready-led');
            const startBtn = document.getElementById('start-vote-btn');
            const endBtn = document.getElementById('end-vote-btn');
            const resultsPlaceholder = document.getElementById('results-placeholder');
            const resultsList = document.getElementById('results-list');
            const addCandidateBtn = document.getElementById('add-candidate-btn');
            const saveJsonBtn = document.getElementById('save-json-btn');
            const loadJsonInput = document.getElementById('load-json-input');
            const resetBtn = document.getElementById('reset-btn');
            const pollTitleInput = document.getElementById('poll-title-input');

            // VVPAT 요소 바인딩
            const vvpatSlip = document.getElementById('vvpat-slip');
            const vvpatSlipPhoto = document.getElementById('vvpat-slip-photo');
            const vvpatSlipName = document.getElementById('vvpat-slip-name');
            const vvpatLed = document.getElementById('vvpat-led');
            
            let isVotingActive = false;
            let candidates = [];
            let nextCandidateId = 1;

            // --- 토스트 알림 기능 ---
            function showToast(message) {
                let toast = document.getElementById('toast-notification');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'toast-notification';
                    toast.className = 'toast-container';
                    document.body.appendChild(toast);
                }
                toast.textContent = message;
                toast.classList.add('show');
                
                if (toast.timeoutId) {
                    clearTimeout(toast.timeoutId);
                }
                
                toast.timeoutId = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }

            // --- 초기화 및 UI 상태 관리 ---
            function initialize() {
                endBtn.disabled = true;
                updateButtonsState();
            }

            function resetSimulator() {
                candidates = [];
                nextCandidateId = 1;
                isVotingActive = false;
                
                pollTitleInput.value = "";
                statusText.textContent = "대기 중";
                readyLed.classList.remove('on');
                resultsPlaceholder.style.display = 'block';
                resultsList.style.display = 'none';
                resultsList.innerHTML = '';
                
                startBtn.disabled = false;
                endBtn.disabled = true;

                // VVPAT 초기화
                vvpatSlip.className = 'vvpat-slip';
                vvpatSlipPhoto.style.display = 'none';
                vvpatSlipName.textContent = "대기 중";
                vvpatLed.style.backgroundColor = '#6b7280';
                vvpatLed.style.boxShadow = 'none';

                renderCandidates();
                showToast("모든 데이터가 초기화되었습니다.");
            }
            resetBtn.addEventListener('click', resetSimulator);


            // --- 후보자 관리 기능 ---
            function renderCandidates() {
                ballotUnit.innerHTML = '';
                candidates.forEach(candidate => {
                    const candidateRow = document.createElement('div');
                    candidateRow.className = 'candidate';
                    candidateRow.dataset.id = candidate.id;
                    
                    candidateRow.innerHTML = `
                        <input type="text" class="candidate-name-input" value="${candidate.name}" placeholder="후보자 이름">
                        <label for="photo-input-${candidate.id}">
                            <img src="${candidate.imgSrc}" alt="후보자 사진" class="candidate-photo" id="photo-preview-${candidate.id}">
                        </label>
                        <input type="file" class="photo-input" id="photo-input-${candidate.id}" accept="image/*" style="display:none;">
                        <div class="vote-led" id="led-${candidate.id}"></div>
                        <button class="vote-button" data-candidate-id="${candidate.id}"></button>
                    `;
                    ballotUnit.appendChild(candidateRow);
                });
                updateButtonsState();
            }

            addCandidateBtn.addEventListener('click', () => {
                const newCandidate = {
                    id: nextCandidateId++,
                    name: `후보자 ${nextCandidateId - 1}`,
                    imgSrc: `https://placehold.co/40x40/EFEFEF/333333?text=${nextCandidateId - 1}`,
                    votes: 0
                };
                candidates.push(newCandidate);
                renderCandidates();
                showToast(`${newCandidate.name}가 추가되었습니다.`);
            });

            ballotUnit.addEventListener('change', event => {
                const target = event.target;
                const candidateDiv = target.closest('.candidate');
                if (!candidateDiv) return;

                const candidateId = parseInt(candidateDiv.dataset.id);
                const candidate = candidates.find(c => c.id === candidateId);
                if (!candidate) return;

                if (target.matches('.candidate-name-input')) {
                    candidate.name = target.value;
                }
                
                if (target.matches('.photo-input')) {
                    const file = target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            candidate.imgSrc = e.target.result;
                            document.getElementById(`photo-preview-${candidateId}`).src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                }
            });

            // --- JSON 저장/불러오기 ---
            saveJsonBtn.addEventListener('click', () => {
                if (candidates.length === 0) {
                    showToast("저장할 후보자 정보가 없습니다.");
                    return;
                }
                const dataToSave = {
                    title: pollTitleInput.value,
                    candidates: candidates
                };
                const dataStr = JSON.stringify(dataToSave, null, 2);
                const dataBlob = new Blob([dataStr], {type: "application/json"});
                const url = URL.createObjectURL(dataBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'poll_data.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast("후보자 목록이 JSON으로 다운로드되었습니다.");
            });

            loadJsonInput.addEventListener('change', event => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const loadedData = JSON.parse(e.target.result);
                            if (loadedData.candidates && Array.isArray(loadedData.candidates)) {
                                candidates = loadedData.candidates;
                                pollTitleInput.value = loadedData.title || "";
                            } else if (Array.isArray(loadedData)) {
                                candidates = loadedData;
                                pollTitleInput.value = "";
                            } else {
                                throw new Error("Invalid format");
                            }
                            
                            nextCandidateId = Math.max(...candidates.map(c => c.id), 0) + 1;
                            renderCandidates();
                            showToast("후보자 목록을 성공적으로 불러왔습니다.");
                        } catch (error) {
                            showToast("올바른 JSON 파일 형식이 아니거나 로드에 실패했습니다.");
                        }
                    };
                    reader.readAsText(file);
                }
            });

            // --- 투표 제어 및 진행 ---
            function updateButtonsState() {
                const allVoteButtons = ballotUnit.querySelectorAll('.vote-button');
                const allNameInputs = ballotUnit.querySelectorAll('.candidate-name-input');
                const allPhotoLabels = ballotUnit.querySelectorAll('.candidate-photo-container label');
                
                const isEditable = !isVotingActive;
                addCandidateBtn.disabled = !isEditable;
                saveJsonBtn.disabled = !isEditable;
                loadJsonInput.disabled = !isEditable;
                resetBtn.disabled = isVotingActive;
                pollTitleInput.disabled = isVotingActive;

                allVoteButtons.forEach(btn => btn.disabled = !isVotingActive);
                allNameInputs.forEach(input => input.disabled = isVotingActive);
                allPhotoLabels.forEach(label => label.style.pointerEvents = isEditable ? 'auto' : 'none');
            }

            startBtn.addEventListener('click', () => {
                if(candidates.length === 0) {
                    showToast('후보자를 먼저 추가해주세요.');
                    return;
                }
                isVotingActive = true;
                startBtn.disabled = true;
                endBtn.disabled = false;
                statusText.textContent = "투표 진행 중";
                readyLed.classList.add('on');
                updateButtonsState();
                showToast("투표가 시작되었습니다.");
            });

            endBtn.addEventListener('click', () => {
                isVotingActive = false;
                startBtn.disabled = true;
                endBtn.disabled = true;
                statusText.textContent = "투표 종료";
                readyLed.classList.remove('on');
                updateButtonsState();
                displayResults();
                showToast("투표가 마감되었습니다. 집계 결과를 확인하세요.");
            });

            // 투표 버튼 클릭 시 동작 (VVPAT 연동 부분)
            ballotUnit.addEventListener('click', (event) => {
                const target = event.target;
                if (target.matches('.vote-button') && isVotingActive) {
                    const candidateId = parseInt(target.dataset.candidateId);
                    const candidate = candidates.find(c => c.id === candidateId);
                    
                    candidate.votes++;
                    
                    // 1. 투표기(EVM) 붉은 LED 점등
                    const votedLed = document.getElementById(`led-${candidateId}`);
                    votedLed.classList.add('on');
                    
                    // 2. VVPAT 인쇄 및 확인증 표시 프로세스 시작
                    vvpatSlipName.textContent = candidate.name;
                    vvpatSlipPhoto.src = candidate.imgSrc;
                    vvpatSlipPhoto.style.display = 'block';
                    vvpatSlip.className = 'vvpat-slip printing'; // 슬립 인쇄 슬라이드 애니메이션

                    // VVPAT 작동 LED 붉은색 점등
                    vvpatLed.style.backgroundColor = 'var(--led-vote)';
                    vvpatLed.style.boxShadow = '0 0 10px var(--led-vote)';

                    statusText.textContent = "VVPAT 용지 출력 확인 중... (4초 대기)";
                    const allButtons = ballotUnit.querySelectorAll('.vote-button');
                    allButtons.forEach(button => button.disabled = true);
                    
                    // 3.5초 후 확인 완료, 용지가 DROP BOX로 낙하하는 애니메이션 수행
                    setTimeout(() => {
                        vvpatSlip.className = 'vvpat-slip dropping'; // 낙하 애니메이션
                        vvpatLed.style.backgroundColor = '#6b7280';
                        vvpatLed.style.boxShadow = 'none';
                    }, 3400);

                    // 4.2초 후 모든 상태 초기화 및 다음 투표 대기 상태 전환
                    setTimeout(() => {
                        votedLed.classList.remove('on');
                        if (isVotingActive) {
                            statusText.textContent = "투표 진행 중";
                            allButtons.forEach(button => button.disabled = false);
                        }
                        
                        // VVPAT 슬립 상태 완전히 보이지 않는 상태로 리셋
                        vvpatSlip.className = 'vvpat-slip';
                        vvpatSlipPhoto.style.display = 'none';
                        vvpatSlipName.textContent = "대기 중";
                    }, 4200);
                }
            });

            // --- 결과 표시 ---
            function displayResults() {
                resultsPlaceholder.style.display = 'none';
                resultsList.style.display = 'block';
                resultsList.innerHTML = ''; 

                const sortedCandidates = [...candidates].sort((a, b) => b.votes - a.votes);
                
                sortedCandidates.forEach(candidate => {
                    const listItem = document.createElement('li');
                    listItem.className = 'result-item';
                    listItem.innerHTML = `
                        <img src="${candidate.imgSrc}" alt="${candidate.name}" class="photo">
                        <span class="name">${candidate.name}</span>
                        <span class="count">${candidate.votes} 표</span>
                    `;
                    resultsList.appendChild(listItem);
                });
            }

            initialize();
        });
    </script>

</body>
</html>
